name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create release ZIP
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          ZIP_NAME="deadair-premiere-${VERSION}.zip"
          STAGING="$RUNNER_TEMP/deadair-release"
          EXTENSION="$STAGING/com.deadair.silenceremover"
          mkdir -p "$EXTENSION"
          cp -R CSXS client host bin installer docs "$EXTENSION/"
          cp README.md LICENSE "$EXTENSION/"
          (cd "$STAGING" && zip -r "$GITHUB_WORKSPACE/$ZIP_NAME" com.deadair.silenceremover)
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          body: |
            ## Installation

            1. Download and extract `${{ env.ZIP_NAME }}`.
            2. Close Premiere. Open the extracted `com.deadair.silenceremover` folder.
            3. On Windows, run `installer/install-win.bat`. On macOS, run `bash installer/install-mac.sh`.
            4. Restart Premiere. Open **Window > Extensions > DeadAir - Silence Remover**.

            The installers replace an existing DeadAir installation and enable unsigned CEP extensions for your user. Review the README before installing manually.

            Video files and audio files of 150 MB or more need FFmpeg. Smaller audio files can load directly when their codec is supported.

            Start with markers on a duplicate sequence. Clip edits affect all video and audio tracks. Close gaps also removes existing gaps and can change A/V sync.
